<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Physiobuddies Therapist</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="phone-screen">
  <main class="splash">
    <div class="splash-bg"></div>
    <div class="splash-content">
      <div class="splash-logo"><img src="https://physiobuddies.in/assets/logo-CZkn2wwb.png" alt="Logo" style="width: 120px; height: auto; object-fit: contain;" /></div>
      <div>
        <h1 style="color:white;font-size:24px;letter-spacing:-.02em">Physiobuddies<br>Therapist</h1>
        <p class="subtle" style="color:rgba(255,255,255,.72);margin-top:6px;font-size:13px">Secure partner app for daily physiotherapy work</p>
      </div>
      <div class="splash-ring"></div>
      <div style="margin-top:24px;display:grid;gap:10px;width:100%;max-width:320px">
        <a class="btn" href="login.html" style="background:white;color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.28)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
          Get started
        </a>
        <a class="btn" href="biometric-unlock.html" style="background:oklch(100% 0 0 / .14);color:white;border-color:rgba(255,255,255,.22);box-shadow:none">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2C9.2 2 7 4.2 7 7v2M12 2c2.8 0 5 2.2 5 5v2M7 9a5 5 0 0 0-5 5v1a5 5 0 0 0 10 0v-1M17 9a5 5 0 0 1 5 5v1a5 5 0 0 1-10 0v-1"/></svg>
          Biometric login
        </a>
      </div>
      <p style="color:rgba(255,255,255,.48);font-size:11px;margin-top:8px">v2.4.1 · Physiobuddies Pvt. Ltd.</p>
    </div>
  </main>
  <script>
    // Auto-navigate after 3s if user doesn't tap
    let gone = false;
    setTimeout(() => { if(!gone) window.location.href = 'login.html'; }, 3000);
    document.querySelector('.btn[href="login.html"]').addEventListener('click', () => { gone = true; });
  </script>
</body>
</html>
