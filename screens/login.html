<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – Physiobuddies Therapist</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body class="phone-screen">
  <div class="auth-screen">
    <div class="auth-hero">
      <div class="auth-hero-img"></div>
      <div class="auth-hero-logo">
        <img src="https://physiobuddies.in/assets/logo-CZkn2wwb.png" alt="Logo" class="logo-mark" style="width: auto; height: 100%; max-height: 48px; object-fit: contain; background: transparent; border-radius: 0;" />
        <h1 style="font-size:20px;color:white;font-weight:800">Physiobuddies Therapist</h1>
        <p style="font-size:12px;color:rgba(255,255,255,.74);margin-top:3px">Therapist Partner App</p>
      </div>
    </div>
    <div class="auth-body">
      <div>
        <h2 style="font-size:20px">Enter your mobile number</h2>
        <p class="subtle" style="margin-top:4px">We'll send a 6-digit OTP to verify your account</p>
      </div>
      <form data-validate-phone data-success="otp.html">
        <div class="field" id="phone-field">
          <label>Mobile number</label>
          <div class="phone-field">
            <span class="flag-prefix">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="15" viewBox="0 0 22 15">
                <rect width="22" height="5" fill="#FF9933"/>
                <rect y="5" width="22" height="5" fill="#fff"/>
                <rect y="10" width="22" height="5" fill="#138808"/>
                <circle cx="11" cy="7.5" r="2" fill="none" stroke="#00008B" stroke-width=".8"/>
              </svg>
              +91
            </span>
            <input type="tel" inputmode="numeric" maxlength="14" placeholder="98765 43210" value="" autocomplete="tel" />
          </div>
          <span class="error">Enter a valid 10-digit Indian mobile number</span>
        </div>
        <div style="margin-top:6px">
          <button type="submit" class="btn" style="margin-top:14px">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Send OTP
          </button>
        </div>
      </form>
      <div class="divider" style="margin:4px 0"></div>
      <div style="text-align:center">
        <p class="subtle">Are you a patient? <a href="#" style="color:var(--accent);font-weight:700">Switch to patient app</a></p>
        <p class="subtle" style="margin-top:10px;font-size:11px;line-height:1.5">By continuing, you agree to Physiobuddies <a href="#" style="color:var(--accent)">Terms of Service</a> and <a href="#" style="color:var(--accent)">Privacy Policy</a></p>
      </div>
    </div>
  </div>
  <script src="../js/app.js"></script>
  <script>
    App.init({});
    // Phone field inline validation
    const form = document.querySelector('[data-validate-phone]');
    const input = form.querySelector('input[type=tel]');
    const field = document.getElementById('phone-field');
    input.addEventListener('input', () => {
      const digits = input.value.replace(/\D/g,'');
      if(digits.length >= 10) field.classList.remove('invalid');
      // Format as 5+5
      const d = digits.slice(0,10);
      if(d.length > 5) input.value = d.slice(0,5)+' '+d.slice(5);
      else input.value = d;
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const digits = input.value.replace(/\D/g,'');
      if(digits.length < 10){ field.classList.add('invalid'); return; }
      window.location.href = form.dataset.success||'otp.html';
    });
  </script>
</body>
</html>
